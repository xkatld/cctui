name: Release Go Binaries

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git Tag Name'
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Build binary
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o dist/cctui-linux-${{ matrix.goarch }} .

      - name: Package binary
        run: |
          cd dist
          tar -czf cctui-linux-${{ matrix.goarch }}.tar.gz cctui-linux-${{ matrix.goarch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cctui-linux-${{ matrix.goarch }}
          path: dist/cctui-linux-${{ matrix.goarch }}.tar.gz
